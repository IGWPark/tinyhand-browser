name: Release

# Push a tag like v0.2.0 to publish TinyHand-Browser.zip as the latest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - run: cp .output/*-chrome.zip TinyHand-Browser.zip
      - run: gh release create "$GITHUB_REF_NAME" TinyHand-Browser.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
